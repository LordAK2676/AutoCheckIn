name: Daily Playwright Auto Check-In

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 2 * * *" # daily at 2 AM UTC

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python (with pip caching)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: req.txt

      # 3. Install Python dependencies
      - name: Install Python dependencies
        run: pip install --upgrade -r req.txt

      # 4. Cache Playwright browsers
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('req.txt') }}

      # 5. Install Firefox browser for Playwright
      - name: Install Playwright Firefox browser
        run: |
          python -m playwright install --with-deps firefox

      # 6. Run your script
      - name: Run Auto Check-In Script
        run: python auto4.py
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}

      # 7. Upload logs for debugging
      - name: Upload script logs
        uses: actions/upload-artifact@v4
        with:
          name: script-logs
          path: script_output.log
